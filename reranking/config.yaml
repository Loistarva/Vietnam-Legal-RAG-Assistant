# Cấu hình pipeline Retrieval hoàn chỉnh; benchmark Tuần 7 có thể ghi đè đầu ra bằng --top-k 5.
reranker:
  enabled: true
  backend: cross_encoder
  model: BAAI/bge-reranker-v2-m3
  rerank_top_k: 10
  max_candidates: 50
  batch_size: 16
  max_length: 512
  device: cpu
  candidate_text: chunk_text

parent_context:
  enabled: true
  parents_file: retrieval/results/dev_tuning/chunking_variants/E/parents.json
  max_context_chars: 6000
