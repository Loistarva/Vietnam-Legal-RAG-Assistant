# Runs on every push and pull request. A red check means the commit breaks
# the parser, the contract tests or a script; fix it before merging.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tests use fixtures and mocks only; never download models in CI.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked snapshot for secrets (NFR3.3-AC1)
        shell: bash
        run: |
          version=8.24.2
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$release/$archive"
          curl -fsSLO "$release/gitleaks_${version}_checksums.txt"
          grep -F "  $archive" "gitleaks_${version}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          snapshot="$(mktemp -d)"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$snapshot"
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner "$snapshot"
          fixture="$(mktemp -d)"
          printf 'gh%s_%s\n' p "$(openssl rand -hex 18)" > "$fixture/synthetic.txt"
          if "$RUNNER_TEMP/gitleaks" dir --config "$snapshot/.gitleaks.toml" --redact=100 --no-banner "$fixture"; then
            echo "Gitleaks accepted a synthetic credential."
            exit 1
          else
            test "$?" -eq 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU build of torch: the default Linux wheel pulls about 2 GB of CUDA libraries.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Fetch pinned negative-set sources
        run: python scripts/validate_negative_set.py --fetch-sources

      - name: No tracked bytecode
        run: |
          if git ls-files | grep -E '\.py[co]$'; then
            echo "Tracked .pyc files found; remove them with git rm --cached."
            exit 1
          fi

      - name: Lint for syntax errors and undefined names
        run: |
          python -m pip install ruff==0.17.4
          # Only errors that break at runtime; the full rule set is in ruff.toml (H3).
          python -m ruff check --select E9,F63,F7,F82 .

      - name: Syntax check of scripts without tests
        run: python -m compileall -q scripts evaluation retrieval reranking embedding chunking parser

      - name: pytest (testpaths in pytest.ini)
        run: python -m pytest
