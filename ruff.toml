# Bộ luật cố định để số lỗi không đổi theo phiên bản ruff (bộ mặc định đổi ở ruff 0.17).
# CI chỉ chặn lỗi nặng: python -m ruff check --select E9,F63,F7,F82 .
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F"]

# E402: các file dưới đây phải thêm thư mục gốc vào sys.path, cấu hình stdout UTF-8
# trên Windows hoặc nạp module bằng importlib trước khi import module của repo.
[lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"test/*.py" = ["E402"]
"retrieval/*.py" = ["E402"]
"parser/test_parser.py" = ["E402"]
"evaluation/run_evaluation.py" = ["E402"]
"embedding/retrieval_smoke_test.py" = ["E402"]
"chunking/export_legal_chunks.py" = ["E402"]
"demo_pipeline.py" = ["E402"]
